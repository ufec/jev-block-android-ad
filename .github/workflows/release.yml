name: Release

# Tags are the only way a release happens here. The workflow does not derive the
# version from the tag -- versionCode and versionName stay hand-written in
# app/build.gradle.kts, and this file's job is to prove the tag agrees with them.
on:
  push:
    tags: ['v[0-9]*']

# Creating a release needs contents: write. A repository or organisation policy
# set to read-only caps this, and the failure shows up at the release step as a
# 403 rather than here.
permissions:
  contents: write

# Serialise releases of the same tag; a re-run queues instead of interrupting.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # The default 360 minutes is far too wide. 45 covers a cold JitPack build,
    # the first AGP configuration and R8.
    timeout-minutes: 45

    env:
      # AGP 9.4.0 pins both MIN_BUILD_TOOLS_REV and DEFAULT_BUILD_TOOLS_REVISION to
      # 36.0.0 -- verified by reading the constants out of
      # com/android/builder/core/ToolsRevisionUtils.class in builder-9.4.0.jar, whose
      # constant pool holds exactly one version string. AGP matches build-tools
      # exactly rather than taking the newest installed one, so installing 37.0.0
      # would only make it fetch 36.0.0 again on its own.
      BUILD_TOOLS_VERSION: '36.0.0'
      ASSET_PREFIX: JevNoiseGate-${{ github.ref_name }}
      # The keystore path is NOT defined here. A job-level env block cannot use the
      # `runner` context -- it has no value until a runner has been assigned, and
      # GitHub rejects the whole file over it ("Unrecognized named-value: 'runner'"),
      # silently dropping the workflow's name and its `on:` filters along with it.
      # Shells get RUNNER_TEMP for free, so the path is built from that instead.

    steps:
      - uses: actions/checkout@v5

      # AGP 9.4.0's minimum is JDK 17 (AndroidPluginBaseServices.minRequiredJavaVersion
      # returns VERSION_17, and AGP's own bytecode is Java 17). No toolchain resolver is
      # configured in settings.gradle.kts, but none is needed: setup-java puts 17 in
      # JAVA_HOME, so jvmToolchain(17) resolves to the running JVM instead of
      # downloading one.
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # v4 bundles current cmdline-tools and accepts the SDK licences by default,
      # so no separate license step is needed.
      - uses: android-actions/setup-android@v4

      - name: Install the Android SDK components
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          # AGP 9 uses the minor-versioned platform package: compileSdk = 37 means
          # platforms;android-37.0. There is no platforms;android-37, and asking for
          # it fails before Gradle even starts.
          sdkmanager --install 'platforms;android-37.0' "build-tools;${BUILD_TOOLS_VERSION}"
          sdkmanager --list_installed | grep -F 'platforms;android-37.0'
          sdkmanager --list_installed | grep -F "build-tools;${BUILD_TOOLS_VERSION}"

      # First of two version checks, and only there to fail fast: there is no point
      # spending five minutes on a build for a mislabelled tag. sed -E rather than
      # grep -P so the same command can be pasted into a macOS shell to debug.
      - name: Validate the tag against the source version
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          src_version="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]*)".*/\1/p' app/build.gradle.kts | head -n1)"
          src_code="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' app/build.gradle.kts | head -n1)"
          echo "tag=${GITHUB_REF_NAME} (${tag_version}) | source versionName=${src_version} versionCode=${src_code}"
          if [ -z "$src_version" ]; then
            echo "::error::could not read versionName from app/build.gradle.kts"
            exit 1
          fi
          if [ "$tag_version" != "$src_version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match versionName ${src_version} in app/build.gradle.kts"
            exit 1
          fi

      # The TypeSafe SDK is built on demand by JitPack: the first request for v0.2.0
      # starts an upstream build, and Gradle sees a 404 while that runs. Gradle treats
      # "module not found" as terminal and caches it for 24 hours, so a plain re-run
      # would replay the cached miss. Hence the explicit backoff, and hence
      # --refresh-dependencies from the second attempt on.
      - name: Warm the JitPack dependency
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            echo "::group::dependency resolution, attempt ${attempt}"
            if [ "$attempt" -eq 1 ]; then
              ./gradlew :app:dependencies --configuration releaseRuntimeClasspath --console=plain
            else
              ./gradlew :app:dependencies --configuration releaseRuntimeClasspath --console=plain --refresh-dependencies
            fi
            status=$?
            echo "::endgroup::"
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            echo "::warning::dependency resolution failed (attempt ${attempt}); retrying in $((attempt * 20))s"
            sleep $((attempt * 20))
          done
          echo "::error::could not resolve dependencies after 3 attempts"
          exit 1

      - name: Run the unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Assemble the release APK
        run: ./gradlew :app:assembleRelease --console=plain

      # Second version check, and the authoritative one: the first proved the source
      # text is right, this proves the bytes that were actually packaged are.
      # output-metadata.json also carries the real file name -- without a signingConfig
      # that is app-release-unsigned.apk -- so nothing here is hard-coded.
      - name: Validate the built artifact
        id: artifact
        run: |
          set -euo pipefail
          metadata=app/build/outputs/apk/release/output-metadata.json
          apk_name="$(jq -r '.elements[0].outputFile' "$metadata")"
          built_version="$(jq -r '.elements[0].versionName' "$metadata")"
          built_code="$(jq -r '.elements[0].versionCode' "$metadata")"
          echo "built ${apk_name} versionName=${built_version} versionCode=${built_code}"
          if [ "$built_version" != "${GITHUB_REF_NAME#v}" ]; then
            echo "::error::built APK reports versionName ${built_version}, tag is ${GITHUB_REF_NAME}"
            exit 1
          fi
          {
            echo "apk=app/build/outputs/apk/release/${apk_name}"
            echo "version_code=${built_code}"
          } >> "$GITHUB_OUTPUT"

      # A missing secret does not fail the workflow at load time -- it produces a
      # zero-byte keystore and an apksigner error that says nothing about secrets.
      - name: Decode the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::secret RELEASE_KEYSTORE_BASE64 is not set"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.p12"
          chmod 600 "$RUNNER_TEMP/release.p12"

      # Signing is a step of the release, not part of the build configuration, so
      # app/build.gradle.kts is deliberately left without a signingConfig -- the same
      # apksigner invocation is what signs a local build by hand.
      #
      # zipalign must run first: apksigner preserves existing alignment when it writes
      # its v2/v3 blocks, but signing first and aligning after would break them.
      #
      # apksigner and zipalign are NOT on PATH. setup-android@v4 only adds
      # platform-tools and cmdline-tools, so the build-tools directory is addressed
      # explicitly, with a fallback in case that exact revision is unavailable.
      - name: Align and sign the APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_PASSWORD:-}" ] || [ -z "${KEY_ALIAS:-}" ]; then
            echo "::error::secrets RELEASE_KEYSTORE_PASSWORD / RELEASE_KEY_ALIAS are not set"
            exit 1
          fi

          build_tools="${ANDROID_HOME}/build-tools/${BUILD_TOOLS_VERSION}"
          if [ ! -x "${build_tools}/zipalign" ] || [ ! -x "${build_tools}/apksigner" ]; then
            echo "::warning::build-tools ${BUILD_TOOLS_VERSION} is unusable, falling back to the newest installed one"
            ls -1 "${ANDROID_HOME}/build-tools" || true
            build_tools="$(ls -d "${ANDROID_HOME}"/build-tools/* | sort -V | tail -n1)"
          fi
          echo "using build-tools at ${build_tools}"

          mkdir -p dist
          # -p only matters for uncompressed .so files; there is no NDK here, so it is
          # a no-op kept for parity with the local signing procedure.
          "${build_tools}/zipalign" -p -f 4 "${{ steps.artifact.outputs.apk }}" "$RUNNER_TEMP/aligned.apk"

          # Passwords go through env: rather than pass: so they cannot leak into the
          # process list or the logs. PKCS12 forces the key password to equal the
          # store password, which is why one secret covers both.
          "${build_tools}/apksigner" sign \
            --ks "$RUNNER_TEMP/release.p12" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEYSTORE_PASSWORD \
            --out "dist/${ASSET_PREFIX}.apk" \
            "$RUNNER_TEMP/aligned.apk"

          "${build_tools}/apksigner" verify --verbose --print-certs "dist/${ASSET_PREFIX}.apk"
          "${build_tools}/zipalign" -c 4 "dist/${ASSET_PREFIX}.apk"
          rm -f "$RUNNER_TEMP/release.p12" "$RUNNER_TEMP/aligned.apk"

      # proguard-rules.pro:35 requires mapping.txt to be archived with every release:
      # R8 output has no line numbers in its stack traces, so retrace against this file
      # is the only way back to a source line. The baseline profiles are equally
      # unreproducible -- two of them, one per API range.
      - name: Collect the mapping and the baseline profiles
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/mapping/release/mapping.txt "dist/mapping-${GITHUB_REF_NAME}.txt"
          # The profiles are the least critical asset here, so a missing zip must not
          # take the release down with it -- warn instead.
          if [ -d app/build/outputs/apk/release/baselineProfiles ]; then
            if command -v zip >/dev/null 2>&1; then
              ( cd app/build/outputs/apk/release \
                && zip -q -r "$GITHUB_WORKSPACE/dist/baseline-profiles-${GITHUB_REF_NAME}.zip" baselineProfiles )
            else
              echo "::warning::zip is unavailable, skipping the baseline profiles"
            fi
          fi
          ls -lh dist

      # Fallback so a failure at the release step does not cost a rebuild: the assets
      # stay downloadable from the run page.
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(dist/*)
          echo "assets: ${assets[*]}"

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # Re-run path. --clobber deletes a same-named asset before uploading it, so
            # it trades the old asset for the new one; if the upload then fails, the old
            # one is already gone. Rejected outright if the repository has immutable
            # releases enabled.
            gh release upload "$GITHUB_REF_NAME" --clobber "${assets[@]}"
          else
            # Attaching the assets to create (rather than uploading afterwards) means gh
            # builds a draft, uploads, then publishes -- there is no window in which the
            # release exists without its files.
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --generate-notes \
              --title "JevNoiseGate ${GITHUB_REF_NAME}" \
              "${assets[@]}"
          fi
